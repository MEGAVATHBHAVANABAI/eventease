<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="login-container">
<div class="login-box">
<h2>Create Account</h2>
<form id="registerForm">
<input type="text"
id="name"
placeholder="Full Name"
required>
<input type="email"
id="regemail"
placeholder="Email"
required>
<input type="password"
id="regpassword"
placeholder="Password"
required>
<input type="password"
id="confirm"
placeholder="Confirm Password"
required>
<button type="submit">
Register
</button>
</form>
<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>
</div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
