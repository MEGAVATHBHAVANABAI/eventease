<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BY Events Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
background-image: url("../images/adminbackground.jpg") ;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;
}
.login-box{
background-color: whitesmoke;
padding:40px;
width:420px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}
.login-box h2{
text-align:center;
margin-bottom:10px;
font-weight:bold;
}
.login-box p{
text-align:center;
color:gray;
margin-bottom:25px;
}
.form-control{
margin-bottom:18px;
height:50px;
}
.btn-login{
width:100%;
height:50px;
font-size:18px;
font-weight:bold;
}
.footer{
text-align:center;
margin-top:20px;
font-size:14px;
color:gray;
}
</style>
</head>
<body>
<div class="login-box">
<h2>❤️BY Events Admin</h2>
<p>Administrator Login</p>
<form action="admin_login.php" method="POST" autocomplete="off">
<input
type="email"
name="email"
class="form-control"
placeholder="Admin Email"
autocomplete="off"
required>
<input
type="password"
name="password"
class="form-control"
placeholder="Password"
autocomplete="new-password"
required>
<button
class="btn btn-primary btn-login">
Login
</button>
</form>
<div class="footer">
© 2026 BY Events Admin Panel
</div>
</div>
</body>
</html>
